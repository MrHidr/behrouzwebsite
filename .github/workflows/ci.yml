name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Payload types
        run: npm run cms:generate:types

      - name: Generate Payload import map and Cloudflare types
        run: |
          npm run cms:generate:importmap
          npm run cf:typegen

      - name: Ensure generated files are committed
        run: git diff --exit-code -- src/payload-types.ts app/'(payload)'/admin/importMap.js worker-configuration.d.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build Linux application
        run: npm run build:server

      - name: Build Cloudflare Worker
        run: npm run cf:build

      - name: Validate Cloudflare deployment bundle
        run: npm run cf:dry-run

      - name: Reject high or critical dependency advisories
        run: npm audit --audit-level=high

      - name: Validate Docker Compose
        env:
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
          PAYLOAD_SECRET: ci-only-not-a-production-secret-32chars
          DATABASE_URL: postgres://behrouz:ci-only-not-a-production-secret@postgres:5432/behrouz_cms
          SERVER_URL: https://example.test
          CMS_ALLOWED_ORIGINS: https://example.test
        run: docker compose -f compose.production.yml config --quiet

      - name: Build production containers
        run: |
          docker build --target migrator -t behrouz-migrator:${{ github.sha }} .
          docker build --target runner -t behrouz-website:${{ github.sha }} .
