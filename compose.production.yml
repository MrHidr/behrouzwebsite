name: behrouz-website

x-logging: &default_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    user: "999:999"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    read_only: true
    tmpfs:
      - /data:size=16m,uid=999,gid=999
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default_logging
    networks:
      - backend

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-behrouz_cms}
      POSTGRES_USER: ${POSTGRES_USER:-behrouz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    logging: *default_logging
    networks:
      - backend

  migrate:
    build:
      context: .
      target: migrator
    environment: &app_environment
      NODE_ENV: production
      CMS_ENABLED: "true"
      PAYLOAD_DB: postgres
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET must be set}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      SERVER_URL: ${SERVER_URL:?SERVER_URL must be set}
      CMS_ALLOWED_ORIGINS: ${CMS_ALLOWED_ORIGINS:?CMS_ALLOWED_ORIGINS must be set}
      CMS_SECURE_COOKIES: ${CMS_SECURE_COOKIES:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CAREER_RATE_LIMIT_REQUIRED: ${CAREER_RATE_LIMIT_REQUIRED:-true}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      TRUST_CLOUDFLARE_IP_HEADER: ${TRUST_CLOUDFLARE_IP_HEADER:-false}
      CAREER_RATE_LIMIT_IP_MAX: ${CAREER_RATE_LIMIT_IP_MAX:-5}
      CAREER_RATE_LIMIT_IP_WINDOW_SECONDS: ${CAREER_RATE_LIMIT_IP_WINDOW_SECONDS:-900}
      CAREER_RATE_LIMIT_GLOBAL_MAX: ${CAREER_RATE_LIMIT_GLOBAL_MAX:-100}
      CAREER_RATE_LIMIT_GLOBAL_WINDOW_SECONDS: ${CAREER_RATE_LIMIT_GLOBAL_WINDOW_SECONDS:-3600}
      CAREER_DUPLICATE_PHONE_HOURS: ${CAREER_DUPLICATE_PHONE_HOURS:-24}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-cms@localhost.invalid}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Behrouz CMS}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    volumes:
      - cms_media:/app/public/media/cms
      - career_files:/app/private/career-files
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default_logging
    networks:
      - backend

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment: *app_environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-3000}:3000"
    init: true
    read_only: true
    volumes:
      - cms_media:/app/public/media/cms
      - career_files:/app/private/career-files
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/.next/cache:size=128m,uid=1001,gid=1001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default_logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend
      - edge

volumes:
  postgres_data:
  cms_media:
  career_files:

networks:
  backend:
    internal: true
  edge:
